version: "2.2"

services:

  # Jaeger

  jaeger-all-in-one:

    image: jaegertracing/all-in-one:latest

    #restart: always

#    user: ${UID}:${GID}

    environment:

      - SPAN_STORAGE_TYPE=elasticsearch

      - ES_SERVER_URLS=http://elasticsearch:9200

      - ES_INDEX_PREFIX=jaegar

    ports:

      - ${JAEGER_UI}

      - 14250:14250

    depends_on:

      elasticsearch:

        condition: service_healthy

    healthcheck:

      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health?wait_for_status=yellow&timeout=50s"]

      interval: 30s

      timeout: 60s

      retries: 3

 

  # Collector

  otel-collector:

    image: otel/opentelemetry-collector-contrib:0.82.0

    env_file:

      - telemetry.env

    #restart: always

#    user: ${UID}:${GID}

    command: ["--config=/etc/otel-collector-config.yaml"]

    volumes:

      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml

    ports:

      - ${PPROF}   # pprof extension

      - ${PROMETHEUS_COLLECTOR}   # Prometheus metrics exposed by the collector

      - ${PROMETHEUS_METRICS}   # Prometheus exporter metrics

      - ${HEALTH_CHECK} # health_check extension

      - ${OTLP_GRPC}   # OTLP gRPC receiver

      - ${OTLP_HTTP}   # OTLP HTTP reciever

    # depends_on:

    #   jaeger-all-in-one:

    #   condition: service_healthy

 

 

  # Prometheus

  prometheus:

    container_name: prometheus

    image: prom/prometheus:latest

    env_file:

      - telemetry.env

    #restart: always

#    user: ${UID}:${GID}

    volumes:

      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

      - ${STORAGE_DIR}/prometheus:/prometheus

    ports:

      - ${PROMETHEUS_UI}

    depends_on:

      - cadvisor

 

 

# Grafana

  grafana:

    container_name: grafana

    image: grafana/grafana:latest

#    user: ${UID}:${GID}

    volumes:

      - ${STORAGE_DIR}/grafana:/var/lib/grafana

    env_file:

      - telemetry.env

    #restart: always

    ports:

      - ${GRAFANA_UI}

 

 

  cadvisor:

    image: gcr.io/cadvisor/cadvisor:v0.47.0

    container_name: cadvisor

    ports:

      - 16689:8080

#    user: ${UID}:${GID}

    cpus: 1

    mem_limit: 2000m

    volumes:

      - /:/rootfs

      - /var/run:/var/run

      - /sys:/sys

      - /var/lib/docker/:/var/lib/docker

      - ${STORAGE_DIR}/cadvisor/:/dev/disk

    devices:

      - /dev/kmsg

    privileged: true

    #restart: unless-stopped

 

  elasticsearch:

    image: docker.elastic.co/elasticsearch/elasticsearch:7.3.2

    container_name: elasticsearch

    environment:

      - discovery.type=single-node

      - xpack.security.enabled=false

    cpus: 1

    mem_limit: 2000m

    ulimits:

      memlock:

        soft: -1

        hard: -1

#    user: ${UID}:${GID}

    healthcheck:

      test: ["CMD-SHELL", "curl -s http://localhost:16690/_cat/health?wait_for_status=yellow&timeout=50s"]

      interval: 30s

      timeout: 60s

      retries: 3

    volumes:

      - ${STORAGE_DIR}/esdata:/usr/share/elasticsearch/data

    ports:

      - "16690:9200"     

    expose:

      - "9200"

 

  curator:

    image: curator:7.0.1

    container_name: curator

    depends_on:

      elasticsearch:

        condition: service_healthy     

    volumes:

     - ${STORAGE_DIR}/curator/config:/config

 
