apiVersion: apps/v1

kind: Deployment

metadata:

  generation: 1

  labels:

    app: collector

  name: otel-collector

  namespace: kla-core-monitoring

spec:

  progressDeadlineSeconds: 600

  replicas: 1

  revisionHistoryLimit: 10

  selector:

    matchLabels:

      app: collector

  strategy:

    rollingUpdate:

      maxSurge: 25%

      maxUnavailable: 25%

    type: RollingUpdate

  template:

    metadata:

      creationTimestamp: null

      labels:

        app: collector

    spec:

      containers:

      - args:

        - --config=/conf/otel-collector-config.yaml

        image: otel/opentelemetry-collector-contrib:latest

        imagePullPolicy: Always

        name: otel-collector

        ports:

        - containerPort: 4317

          name: otlp-grpc

          protocol: TCP

        - containerPort: 4318

          name: otlp-http

          protocol: TCP

        - containerPort: 8887

          name: metrics

          protocol: TCP

        resources: {}

        terminationMessagePath: /dev/termination-log

        terminationMessagePolicy: File

        volumeMounts:

        - mountPath: /conf

          name: config

      dnsPolicy: ClusterFirst

      restartPolicy: Always

      schedulerName: default-scheduler

      securityContext: {}

      terminationGracePeriodSeconds: 30

      volumes:

      - configMap:

          defaultMode: 420

          name: otel-collector-config

        name: config
